[project]
name = "veditor"
version = "0.1.0"
description = "VEditor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0"
]

[project.scripts]
veditor = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "httpx>=0.27.0",
    "ruff>=0.6.1",
    "pre-commit>=3.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["migrations"]
